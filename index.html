<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>DevShowcase</title>
	<style>
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;margin:0;padding:2rem;background:#f7f9fc;color:#0b1221}
		header{max-width:900px;margin:0 auto 2rem}
		h1{margin:.2rem 0;font-size:1.8rem}
		p.lead{color:#495160}
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;max-width:900px;margin:0 auto}
		.card{background:#fff;border:1px solid #e6e9ef;padding:1rem;border-radius:8px}
		footer{max-width:900px;margin:2rem auto;color:#6b7280;font-size:.9rem}
	</style>
</head>
<body>
	<header>
		<h1>DevShowcase</h1>
		<p class="lead">A simple showcase page for projects and demos.</p>
	</header>

	<main class="grid" id="projects">
		<article class="card">
			<h2>Project One</h2>
			<p>Short description of project one. Add links or screenshots here.</p>
		</article>
		<article class="card">
			<h2>Project Two</h2>
			<p>Short description of project two. Replace with your content.</p>
		</article>
		<article class="card">
			<h2>Project Three</h2>
			<p>Short description of project three.</p>
		</article>
	</main>

	<footer>
		<p>Made with ❤️ — DevShowcase</p>
	</footer>
</body>
</html>
